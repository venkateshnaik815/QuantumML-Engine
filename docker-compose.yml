version: '3.8'
services:
  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: npm run dev
    ports:
      - "5173:5173"
  core-api:
    image: openjdk:21-jdk
    working_dir: /app
    volumes:
      - ./core-api:/app
    command: ./mvnw spring-boot:run
    ports:
      - "8080:8080"
